name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Run tests inside the Docker image so headless OpenCASCADE/libGL libs and image build are both verified.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t forge-ci .
      - run: docker run --rm forge-ci uv run --locked pytest -q

  submit:
    # Skipped until the team has set the variables/secrets from the organisers
    if: github.event_name == 'push' && vars.ECR_REPOSITORY_URI != ''
    needs: test
    runs-on: ubuntu-latest
    concurrency: submit
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: ./.ci/push.sh
        env:
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
          S3_SUBMISSION_URI: ${{ vars.S3_SUBMISSION_URI }}
